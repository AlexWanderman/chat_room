[package]
name = "chat_rooms"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["form", "http2", "tokio", "ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
cargo-audit = "0.22.2"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
log = "0.4.34"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tera = "2.1.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "signal"] }
tower = "0.5.3"
tower-cookies = { version = "0.11.0", features = ["private", "signed"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
axum-test = { version = "21.0.0", features = ["ws"] }
